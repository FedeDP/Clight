<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
  "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- Only needed when running clight on system bus (--system-bus) -->
<busconfig>
    <policy user="root">
        <allow own="org.clight.clight"/>
    </policy>

    <!-- Users in "clight" group may control clight -->
    <policy group="clight">
        <allow send_destination="org.clight.clight"/>
    </policy>

    <policy context="default">
        <allow receive_sender="org.clight.clight"/>
    </policy>
</busconfig>
